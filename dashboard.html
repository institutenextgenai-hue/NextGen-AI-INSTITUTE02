<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | NextGen AI Academy</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="padding:35px 0"><div class="topbar"><a href="/">NEXTGEN AI ACADEMY</a><button onclick="logout()">Sign out</button></div><h1>My learning</h1><p id="who"></p><div id="courses" class="grid"></div><div id="lesson" class="panel" style="margin-top:25px"><h2>Select a course</h2><p>Your enrolled courses and learning content will appear here.</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb,token,session;
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){const c=await (await fetch('/api/config')).json();if(!c.supabaseUrl)return alert('Database is not configured.');sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const g=await sb.auth.getSession();session=g.data.session;if(!session)return location='/login.html';token=session.access_token;who.textContent='Signed in as '+session.user.email;loadCourses();}
async function loadCourses(){const [cr,en]=await Promise.all([fetch('/api/courses').then(r=>r.json()),fetch('/api/enrolments',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json())]);const rows=Array.isArray(en)?en:[];courses.innerHTML=cr.map(x=>{const e=rows.find(v=>v.course_id===x.id),paid=e&&(e.status==='paid'||e.status==='completed');return `<article class="card"><div class="icon">${x.id==='ai-fundamentals'?'🤖':x.id==='ai-business'?'🚀':'💡'}</div><h3>${esc(x.title)}</h3><p>${esc(x.duration)} · R${x.price}</p><p>${paid?'Access granted':'Not enrolled yet'}</p>${paid?`<button class="full" onclick="openCourse('${x.id}')">Open course</button>${e.status==='completed'?'<span class="badge">Completed</span>':''}`:`<button class="full" onclick="buy('${x.id}')">Buy course · R${x.price}</button>`}</article>`}).join('');}
async function buy(id){const r=await fetch('/api/payfast/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({courseId:id})});const d=await r.json();if(!r.ok)return alert(d.error||'Payment could not start.');if(d.alreadyEnrolled)return openCourse(id);const f=document.createElement('form');f.method='POST';f.action=d.url;Object.entries(d.fields).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i)});document.body.appendChild(f);f.submit();}
async function openCourse(id){const {data:ls,error}=await sb.from('lessons').select('*').eq('course_id',id).order('sort_order');if(error)return alert(error.message);const {data:pr}=await sb.from('progress').select('lesson_id').eq('user_id',session.user.id);const done=new Set((pr||[]).map(x=>x.lesson_id));lesson.innerHTML=`<h2>${esc(id==='ai-fundamentals'?'AI Fundamentals':id==='ai-business'?'AI for Business':'Digital Entrepreneurship')}</h2><p>Complete every lesson to unlock your certificate.</p>`+(ls||[]).map((l,i)=>`<div class="lesson"><h3>${i+1}. ${esc(l.title)} ${done.has(l.id)?'✓':''}</h3><p>${esc(l.body)}</p><button onclick="complete('${l.id}','${id}')">${done.has(l.id)?'Completed':'Mark complete'}</button></div>`).join('')+`<hr><button onclick="certificate('${id}')">Request certificate</button>`;}
async function complete(id,course){const r=await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({lessonId:id})});if(!r.ok){const d=await r.json();return alert(d.error||'Could not save progress')}openCourse(course);}
async function certificate(id){const r=await fetch('/api/certificate/'+id,{headers:{Authorization:'Bearer '+token}});if(!r.ok){const d=await r.json().catch(()=>({}));return alert(d.error||'Complete all lessons first.')}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=id+'-certificate.pdf';a.click();URL.revokeObjectURL(url);}
async function logout(){await sb.auth.signOut();location='/'}init();</script></body></html>
