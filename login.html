<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | NextGen AI Academy</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="padding:50px 0"><a href="/">← Academy</a><h1>Student portal</h1><p>Create your account or sign in. Paid courses appear in your dashboard.</p><div class="panel" style="max-width:520px"><input id="name" placeholder="Full name" style="width:100%;padding:12px;margin:5px 0;background:#080b10;color:white;border:1px solid #334052;border-radius:8px"><input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:5px 0;background:#080b10;color:white;border:1px solid #334052;border-radius:8px"><input id="phone" placeholder="WhatsApp / phone" style="width:100%;padding:12px;margin:5px 0;background:#080b10;color:white;border:1px solid #334052;border-radius:8px"><input id="pass" type="password" placeholder="Password (8+ characters)" style="width:100%;padding:12px;margin:5px 0;background:#080b10;color:white;border:1px solid #334052;border-radius:8px"><button onclick="signup()">Create account</button> <button onclick="login()">Sign in</button><p id="msg"></p></div><div id="dash" style="margin-top:35px"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb;async function setup(){let c=await (await fetch('/api/config')).json();if(!c.supabaseUrl){msg('Database is not connected yet. Complete .env setup before launch.');return}sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey)}function msg(x){document.getElementById('msg').textContent=x}async function signup(){if(!sb)return;let email=document.getElementById('email').value,pass=document.getElementById('pass').value;let {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:document.getElementById('name').value,phone:document.getElementById('phone').value}}});msg(error?error.message:'Account created. Check your email if confirmation is enabled.')}async function login(){if(!sb)return;let {data,error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return msg(error.message);location.href='/dashboard.html'}setup();</script></body></html>
